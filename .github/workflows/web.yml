name: Website

# Builds the CloudPanels web app on GitHub's machines and publishes it on
# GitHub Pages (the gh-pages branch). Started by hand for each version, before
# that version reaches main: the iPad app is built from what is published here.
# With "publish" off it only installs, tests and builds, and lists the files
# made, to compare them with what is published.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the website (off: only build and check)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the packages
        run: npm install --no-audit --no-fund
      - name: Look at the MEGA package (diagnosis only)
        run: |
          node -e "const p=require('./node_modules/megajs/package.json');console.log(p.name,p.version)"
          sha256sum node_modules/megajs/dist/main.browser-es.mjs
          ls -la node_modules/megajs/dist
          npm ls --all 2>/dev/null | head -60
          sed -i "s/const expectedHash = '[0-9a-f]*'/const expectedHash = '$(sha256sum node_modules/megajs/dist/main.browser-es.mjs | cut -d' ' -f1)'/" scripts/patch-megajs.mjs
      - name: Run the tests
        run: npm test
      - name: Build the website
        run: |
          set -o pipefail
          npm run build
          grep -o "IPAD · 0\.9\.[0-9]*" dist/index.html
          # The files made (not the voice files), to compare with the published ones.
          (cd dist && find . -type f ! -path './tts/*' ! -name _headers | sed 's|^\./||' | sort | while read -r file; do echo "$(git hash-object "$file") $file"; done)
      - name: Compare app.js with the published one (diagnosis only)
        run: |
          git fetch -q origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git show origin/gh-pages:app.js > "$RUNNER_TEMP/published.js"
          npx esbuild "$RUNNER_TEMP/published.js" --format=esm --log-level=error > "$RUNNER_TEMP/published.pretty.js"
          npx esbuild dist/app.js --format=esm --log-level=error > "$RUNNER_TEMP/built.pretty.js"
          npm install --no-save --no-audit --no-fund acorn@8 > /dev/null
          node .github/diagnose/shape.cjs "$RUNNER_TEMP/published.pretty.js" "$RUNNER_TEMP/published.shape"
          node .github/diagnose/shape.cjs "$RUNNER_TEMP/built.pretty.js" "$RUNNER_TEMP/built.shape"
          wc -l "$RUNNER_TEMP/published.shape" "$RUNNER_TEMP/built.shape"
          echo "shape diff lines: $(diff "$RUNNER_TEMP/published.shape" "$RUNNER_TEMP/built.shape" | wc -l)"
          diff -u "$RUNNER_TEMP/published.shape" "$RUNNER_TEMP/built.shape" | cut -c1-300 | head -1500 || true
      - name: Publish on GitHub Pages
        if: inputs.publish
        run: |
          set -eo pipefail
          git fetch -q origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git worktree add -q --detach "$RUNNER_TEMP/site" origin/gh-pages
          cd "$RUNNER_TEMP/site"
          git rm -rq .
          cp -r "$GITHUB_WORKSPACE/dist/." .
          rm -f _headers
          touch .nojekyll
          git add -A
          version="$(grep -o 'IPAD · 0\.9\.[0-9]*' index.html | cut -d' ' -f3)"
          git -c user.name="CloudPanels build" -c user.email="build@users.noreply.github.com" commit -qm "Website ${version} (${GITHUB_SHA})"
          git push -q origin HEAD:gh-pages
          echo "Published ${version}."
